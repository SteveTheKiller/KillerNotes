# Submits KillerNotes to winget-pkgs when a GitHub release is published.
#
# This is the SINGLE winget submission path - release.ps1 deliberately does not call komac.
# Doing it in both places double-submits (KillerPDF hit that on 2026-08-04).
#
# Needs the WINGET_TOKEN secret: a CLASSIC personal access token with the public_repo scope.
# Fine-grained tokens can commit but cannot open the pull request to winget-pkgs. Without the
# secret this fails in about 7 seconds with "GitHub token is invalid" - which is silent unless
# you look at the Actions tab, so check a release actually produced a PR.
#
# `komac update` only works once the package already exists in winget-pkgs; the very first
# submission has to be `komac new` by hand.
#
# A release-triggered run starts seconds after release.ps1 finished creating the release and
# uploading its assets, and GitHub throttles the branch push komac needs on the way out. It
# surfaces as "Ref cannot be created" or "SteveTheKiller does not have the correct permissions
# to execute CreateRef", which reads like a bad token and is not: the same secret succeeds on a
# later retry. That cost four releases across four repos before it was identified on 2026-08-26.
# The submit step now settles first and retries with backoff.
#
# workflow_dispatch is still the manual retry path: re-running this with the tag is the fix for
# anything the backoff does not outlast, and it needs no re-release.

name: WinGet Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.7)'
        required: true

jobs:
  submit:
    runs-on: windows-latest
    steps:
      # Prints what WINGET_TOKEN actually is, so a failure downstream is never guesswork again.
      # An empty x-oauth-scopes means a FINE-GRAINED token, which authenticates fine, reads fine,
      # and cannot create the branch komac needs. That failure is reported as
      # "does not have the correct permissions to execute CreateRef", which reads like something
      # else entirely. A classic token prints its scopes and must include public_repo.
      - name: Check WinGet token
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "KillerNotes-WinGet-Release"
          }
          try {
              $r = Invoke-WebRequest -Uri "https://api.github.com/user" -Headers $headers -UseBasicParsing
              $login = ($r.Content | ConvertFrom-Json).login
              $scopes = $r.Headers['x-oauth-scopes']
              $expiry = $r.Headers['github-authentication-token-expiration']
              Write-Host "login:   $login"
              Write-Host "scopes:  $scopes"
              Write-Host "expires: $expiry"
              if (-not $scopes) {
                  Write-Host "WARNING: no scopes reported. This is a fine-grained token and it CANNOT push a branch to the winget-pkgs fork. Replace it with a classic PAT carrying public_repo."
              }
              elseif ($scopes -notmatch 'public_repo|(^|,\s*)repo(,|$)') {
                  Write-Host "WARNING: classic token without public_repo or repo. It cannot push a branch to the winget-pkgs fork."
              }
          } catch {
              Write-Host "WARNING: /user returned $($_.Exception.Response.StatusCode.value__). The token is invalid or expired."
          }

          # Can this token actually write to the fork? This is the exact permission komac needs.
          try {
              $f = Invoke-RestMethod -Uri "https://api.github.com/repos/SteveTheKiller/winget-pkgs" -Headers $headers
              Write-Host "fork push permission: $($f.permissions.push)"
          } catch {
              Write-Host "WARNING: cannot read the winget-pkgs fork with this token."
          }
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh

      - name: Install Komac
        run: |
          # Authenticated so this does not spend the unauthenticated API allowance, which is
          # shared per runner IP and which a release-triggered run has usually already burned.
          # KillerPDF 1.7.5 failed right here on "API rate limit exceeded", before komac ran.
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "KillerNotes-WinGet-Release"
          }
          $tag = (Invoke-RestMethod "https://api.github.com/repos/russellbanks/Komac/releases/latest" -Headers $headers).tag_name
          $ver = $tag.TrimStart('v')
          $url = "https://github.com/russellbanks/Komac/releases/download/$tag/komac-$ver-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\komac.exe"
          Add-Content $env:GITHUB_PATH $env:RUNNER_TEMP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh

      # komac branches from the fork's master, so a stale fork breaks the branch and the PR.
      # GitHub reports that as "does not have the correct permissions to execute CreateRef",
      # which reads like a token problem and is not. The fork was 7,877 commits behind when
      # this was tracked down on 2026-08-26, and every app shares the one fork, so all five
      # repos started failing together.
      - name: Sync the winget-pkgs fork
        run: komac sync
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh

      - name: Submit to WinGet
        run: |
          $releaseTag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.tag }}" } else { "${{ github.event.release.tag_name }}" }
          $version = $releaseTag.TrimStart('v')
          $url = "https://github.com/SteveTheKiller/KillerNotes/releases/download/$releaseTag/KillerNotes.exe"

          # Let the release settle before asking GitHub for a branch. See the header note.
          if ("${{ github.event_name }}" -eq "release") { Start-Sleep -Seconds 90 }

          # komac picks a fresh GUID for its branch name every run, so a retry never collides
          # with a half-finished attempt.
          $delays = @(60, 150, 300)
          for ($i = 0; $i -le $delays.Count; $i++) {
              komac update SteveTheKiller.KillerNotes --version $version --urls $url --submit
              if ($LASTEXITCODE -eq 0) { exit 0 }
              if ($i -eq $delays.Count) { break }
              Write-Host "Submit failed with exit $LASTEXITCODE. Retrying in $($delays[$i])s."
              Start-Sleep -Seconds $delays[$i]
          }
          Write-Error "komac update failed after $($delays.Count + 1) attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
